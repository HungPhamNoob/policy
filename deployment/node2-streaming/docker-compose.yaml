# ============================================================
# Node 2 - Streaming (Spot VM)
# 3 Kafka brokers, one unified Flink job, Redis, and US/TomTom producers.
# Topics: traffic.us.raw and traffic.tomtom.raw
# ============================================================

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: node2-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: -Xms128m -Xmx512m
      ZOO_AUTOPURGE_PURGEINTERVAL: 12
      ZOO_AUTOPURGE_SNAPRETAINCOUNT: 3
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - capstone-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep 'Mode:'"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================
  # 3 Kafka Brokers
  # ==========================================================
  kafka-1:
    image: confluentinc/cp-kafka:7.6.0
    container_name: node2-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${NODE2_INTERNAL_IP:-10.128.0.9}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-6}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    networks:
      - capstone-net
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'echo > /dev/tcp/localhost/9092'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging

  kafka-2:
    image: confluentinc/cp-kafka:7.6.0
    container_name: node2-kafka-2
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${NODE2_INTERNAL_IP:-10.128.0.9}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-6}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    networks:
      - capstone-net
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'echo > /dev/tcp/localhost/9092'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging

  kafka-3:
    image: confluentinc/cp-kafka:7.6.0
    container_name: node2-kafka-3
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${NODE2_INTERNAL_IP:-10.128.0.9}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-6}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    networks:
      - capstone-net
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'echo > /dev/tcp/localhost/9092'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging

  kafka-topic-init:
    # Long-running topic guard. It creates and validates the US replay and
    # TomTom raw topics, then stays alive so operators do not mistake a
    # successful one-shot exit for a crash in Docker Compose dashboards.
    image: confluentinc/cp-kafka:7.6.0
    container_name: node2-kafka-topic-init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW:-traffic.us.raw}
      KAFKA_TOPIC_TOMTOM_RAW: ${KAFKA_TOPIC_TOMTOM_RAW:-traffic.tomtom.raw}
    command: |
      bash -ec '
        BOOTSTRAP_SERVERS="$${KAFKA_BOOTSTRAP_SERVERS}"
        TOPICS="$${KAFKA_TOPIC_RAW} $${KAFKA_TOPIC_TOMTOM_RAW}"

        echo "Waiting for Kafka brokers at $${BOOTSTRAP_SERVERS}."
        for i in $(seq 1 30); do
          if kafka-broker-api-versions --bootstrap-server "$${BOOTSTRAP_SERVERS}" >/dev/null 2>&1; then
            break
          fi
          echo "Kafka not ready yet ($${i}/30)."
          sleep 2
        done

        if ! kafka-broker-api-versions --bootstrap-server "$${BOOTSTRAP_SERVERS}" >/dev/null 2>&1; then
          echo "Kafka brokers not reachable after waiting. Exiting for restart."
          exit 1
        fi

        for TOPIC_NAME in $${TOPICS}; do
          echo "Creating Kafka topic $${TOPIC_NAME} with three partitions and three replicas."
          kafka-topics --bootstrap-server "$${BOOTSTRAP_SERVERS}" --create --if-not-exists --topic "$${TOPIC_NAME}" --partitions 3 --replication-factor 3

          echo "Validating Kafka topic $${TOPIC_NAME}."
          kafka-topics --bootstrap-server "$${BOOTSTRAP_SERVERS}" --describe --topic "$${TOPIC_NAME}"
        done

        echo "Kafka topic init complete. Holding container open."
        tail -f /dev/null
      '
    networks:
      - capstone-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'echo > /dev/tcp/kafka-1/29092 && echo > /dev/tcp/kafka-2/29092 && echo > /dev/tcp/kafka-3/29092'"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================
  # 3 Producers - row_index modulo split avoids duplicate replay rows.
  # ==========================================================
  producer-1:
    image: python:3.10-slim
    container_name: node2-producer-0
    working_dir: /app
    command: >
      bash -c "
      pip install --no-cache-dir confluent-kafka==2.3.0 python-dotenv==1.0.1 gcsfs==2024.3.1 google-auth==2.23.4 google-cloud-storage==2.14.0 &&
      python us_replay_producer.py
      "
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW:-traffic.us.raw}
      STREAM_MAX_RECORDS: ${STREAM_MAX_RECORDS:-0}
      STREAM_THROTTLE_SECONDS: ${STREAM_THROTTLE_SECONDS:-0.0}
      STREAM_LOOP_FOREVER: ${STREAM_LOOP_FOREVER:-true}
      US_REPLAY_START_ROW: ${US_REPLAY_START_ROW:-0}
      TOTAL_PRODUCERS: ${TOTAL_PRODUCERS:-3}
      PRODUCER_INDEX: "0"
      PRODUCER_FLUSH_EVERY_N_RECORDS: ${PRODUCER_FLUSH_EVERY_N_RECORDS:-5000}
      US_PIPELINE_REPLAY_PATH: ${US_PIPELINE_REPLAY_PATH:-gs://big-data-group-4-bronze/process/us_pipeline_from_2020.csv}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ../../ingestion/kafka/us_producer.py:/app/us_replay_producer.py:ro
      - ${GCP_SERVICE_ACCOUNT_KEY:-/dev/null}:/secrets/gcp-key.json:ro
    networks:
      - capstone-net
    depends_on:
      kafka-topic-init:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  producer-2:
    image: python:3.10-slim
    container_name: node2-producer-1
    working_dir: /app
    command: >
      bash -c "
      pip install --no-cache-dir confluent-kafka==2.3.0 python-dotenv==1.0.1 gcsfs==2024.3.1 google-auth==2.23.4 google-cloud-storage==2.14.0 &&
      python us_replay_producer.py
      "
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW:-traffic.us.raw}
      US_PIPELINE_REPLAY_PATH: ${US_PIPELINE_REPLAY_PATH:-gs://big-data-group-4-bronze/process/us_pipeline_from_2020.csv}
      STREAM_MAX_RECORDS: ${STREAM_MAX_RECORDS:-0}
      STREAM_THROTTLE_SECONDS: ${STREAM_THROTTLE_SECONDS:-0.0}
      STREAM_LOOP_FOREVER: ${STREAM_LOOP_FOREVER:-true}
      US_REPLAY_START_ROW: ${US_REPLAY_START_ROW:-0}
      TOTAL_PRODUCERS: ${TOTAL_PRODUCERS:-3}
      PRODUCER_INDEX: "1"
      PRODUCER_FLUSH_EVERY_N_RECORDS: ${PRODUCER_FLUSH_EVERY_N_RECORDS:-5000}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ../../ingestion/kafka/us_producer.py:/app/us_replay_producer.py:ro
      - ${GCP_SERVICE_ACCOUNT_KEY:-/dev/null}:/secrets/gcp-key.json:ro
    networks:
      - capstone-net
    depends_on:
      kafka-topic-init:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  producer-3:
    image: python:3.10-slim
    container_name: node2-producer-2
    working_dir: /app
    command: >
      bash -c "
      pip install --no-cache-dir confluent-kafka==2.3.0 python-dotenv==1.0.1 gcsfs==2024.3.1 google-auth==2.23.4 google-cloud-storage==2.14.0 &&
      python us_replay_producer.py
      "
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW:-traffic.us.raw}
      US_PIPELINE_REPLAY_PATH: ${US_PIPELINE_REPLAY_PATH:-gs://big-data-group-4-bronze/process/us_pipeline_from_2020.csv}
      STREAM_MAX_RECORDS: ${STREAM_MAX_RECORDS:-0}
      STREAM_THROTTLE_SECONDS: ${STREAM_THROTTLE_SECONDS:-0.0}
      STREAM_LOOP_FOREVER: ${STREAM_LOOP_FOREVER:-true}
      US_REPLAY_START_ROW: ${US_REPLAY_START_ROW:-0}
      TOTAL_PRODUCERS: ${TOTAL_PRODUCERS:-3}
      PRODUCER_INDEX: "2"
      PRODUCER_FLUSH_EVERY_N_RECORDS: ${PRODUCER_FLUSH_EVERY_N_RECORDS:-5000}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ../../ingestion/kafka/us_producer.py:/app/us_replay_producer.py:ro
      - ${GCP_SERVICE_ACCOUNT_KEY:-/dev/null}:/secrets/gcp-key.json:ro
    networks:
      - capstone-net
    depends_on:
      kafka-topic-init:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  tomtom-producer:
    image: python:3.10-slim
    container_name: node2-tomtom-producer
    working_dir: /app
    command: >
      bash -c "
      pip install --no-cache-dir confluent-kafka==2.3.0 python-dotenv==1.0.1 requests==2.31.0 &&
      python tomtom_producer.py
      "
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_TOMTOM_RAW:-traffic.tomtom.raw}
      TOMTOM_API: ${TOMTOM_API:-}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      TOMTOM_ENDPOINT: ${TOMTOM_ENDPOINT:-https://api.tomtom.com/traffic/services/5/incidentDetails}
      TOMTOM_BBOX: ${TOMTOM_BBOX:--74.25909,40.477399,-73.700181,40.917577}
      TOMTOM_BBOXES: ${TOMTOM_BBOXES:-US:New_York:-74.25909,40.477399,-73.700181,40.917577}
      TOMTOM_LANGUAGE: ${TOMTOM_LANGUAGE:-en-US}
      TOMTOM_TIME_VALIDITY: ${TOMTOM_TIME_VALIDITY:-present}
      TOMTOM_POLL_SECONDS: ${TOMTOM_POLL_SECONDS:-60}
      TOMTOM_RUN_ONCE: ${TOMTOM_RUN_ONCE:-false}
      STREAM_MAX_RECORDS: ${STREAM_MAX_RECORDS:-0}
      PRODUCER_FLUSH_EVERY_N_RECORDS: ${PRODUCER_FLUSH_EVERY_N_RECORDS:-5000}
      STREAMING_LOG_LEVEL: ${STREAMING_LOG_LEVEL:-INFO}
    volumes:
      - ../../ingestion/kafka/tomtom_producer.py:/app/tomtom_producer.py:ro
    networks:
      - capstone-net
    depends_on:
      kafka-topic-init:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  tomtom-live-consumer:
    build:
      context: ../..
      dockerfile: deployment/node2-streaming/Dockerfile.flink
    image: capstone/flink-streaming:1.19-node2
    container_name: node2-tomtom-live-consumer
    user: root
    entrypoint: []
    working_dir: /opt/traffic
    command: >
      bash -c "
        /opt/flink/pyenv/bin/pip install --no-cache-dir confluent-kafka==2.3.0 &&
        python processing/tomtom_realtime_consumer.py
      "
    environment:
      PYTHONPATH: /opt/traffic
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_TOPIC_TOMTOM_RAW: ${KAFKA_TOPIC_TOMTOM_RAW:-traffic.tomtom.raw}
      TOMTOM_CONSUMER_GROUP: ${TOMTOM_CONSUMER_GROUP:-tomtom-live-postgres-consumer}
      TOMTOM_CONSUMER_AUTO_OFFSET_RESET: ${TOMTOM_CONSUMER_AUTO_OFFSET_RESET:-earliest}
      TOMTOM_CONSUMER_POLL_TIMEOUT_SECONDS: ${TOMTOM_CONSUMER_POLL_TIMEOUT_SECONDS:-1}
      TOMTOM_FLUSH_INTERVAL_SECONDS: ${TOMTOM_FLUSH_INTERVAL_SECONDS:-15}
      POSTGRES_HOST: ${POSTGRES_HOST:-10.128.0.4}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-capstone_db}
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_TOMTOM_TABLE: ${POSTGRES_TOMTOM_TABLE:-traffic_tomtom_incidents}
      PG_BATCH_SIZE: ${PG_BATCH_SIZE:-200}
      PG_POOL_MAX_CONN: ${PG_POOL_MAX_CONN:-4}
      OPEN_METEO_ENDPOINT: ${OPEN_METEO_ENDPOINT:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_ARCHIVE_ENDPOINT: ${OPEN_METEO_ARCHIVE_ENDPOINT:-https://archive-api.open-meteo.com/v1/archive}
      OPEN_METEO_TIMEOUT_SECONDS: ${OPEN_METEO_TIMEOUT_SECONDS:-5}
      STREAMING_LOG_LEVEL: ${STREAMING_LOG_LEVEL:-INFO}
    volumes:
      - ../..:/opt/traffic:ro
    networks:
      - capstone-net
    depends_on:
      kafka-topic-init:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================
  # Flink JobManager
  # ==========================================================
  flink-jobmanager:
    build:
      context: ../..
      dockerfile: deployment/node2-streaming/Dockerfile.flink
    image: capstone/flink-streaming:1.19-node2
    container_name: node2-flink-jm
    user: root
    entrypoint: []
    command: >
      bash -c "
        mkdir -p /opt/flink/checkpoints &&
        mkdir -p /opt/flink/tmp &&
        chown -R flink:flink /opt/flink/checkpoints &&
        chown -R flink:flink /opt/flink/tmp &&
        chmod -R 775 /opt/flink/checkpoints &&
        chmod -R 775 /opt/flink/tmp &&
        /docker-entrypoint.sh jobmanager
      "
    ports:
      - "8081:8081"
    environment:
      PYTHONPATH: /opt/traffic
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        state.checkpoints.dir: ${FLINK_CHECKPOINT_DIR:-gs://big-data-group-4-backups/checkpoints/flink}
        execution.checkpointing.interval: ${FLINK_CHECKPOINT_INTERVAL:-30000}
        execution.checkpointing.timeout: ${FLINK_CHECKPOINT_TIMEOUT:-1800000}
        execution.checkpointing.min-pause: ${FLINK_CHECKPOINT_MIN_PAUSE:-120000}
        execution.checkpointing.tolerable-failed-checkpoints: ${FLINK_TOLERABLE_FAILED_CHECKPOINTS:-10}
    volumes:
      - ../..:/opt/traffic:ro
      - flink_data:/opt/flink/checkpoints
      - flink_tmp:/opt/flink/tmp
    networks:
      - capstone-net
    depends_on:
      kafka-topic-init:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    restart: on-failure
    logging: *default-logging

  flink-taskmanager:
    build:
      context: ../..
      dockerfile: deployment/node2-streaming/Dockerfile.flink
    image: capstone/flink-streaming:1.19-node2
    container_name: node2-flink-tm
    user: root
    entrypoint: []
    command: >
      bash -c "
        mkdir -p /opt/flink/checkpoints &&
        mkdir -p /opt/flink/tmp &&
        chown -R flink:flink /opt/flink/checkpoints &&
        chown -R flink:flink /opt/flink/tmp &&
        chmod -R 775 /opt/flink/checkpoints &&
        chmod -R 775 /opt/flink/tmp &&
        /docker-entrypoint.sh taskmanager
      "
    environment:
      PYTHONPATH: /opt/traffic
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1536m
        state.checkpoints.dir: ${FLINK_CHECKPOINT_DIR:-gs://big-data-group-4-backups/checkpoints/flink}
        execution.checkpointing.timeout: ${FLINK_CHECKPOINT_TIMEOUT:-1800000}
        execution.checkpointing.min-pause: ${FLINK_CHECKPOINT_MIN_PAUSE:-120000}
        execution.checkpointing.tolerable-failed-checkpoints: ${FLINK_TOLERABLE_FAILED_CHECKPOINTS:-10}
        taskmanager.tmp.dirs: ${FLINK_TMP_DIR:-/opt/flink/tmp}
      SILVER_FEATURES_PATH: ${SILVER_FEATURES_PATH:-gs://big-data-group-4-silver/process/flink_features}
      SILVER_FLUSH_EVERY_N: ${SILVER_FLUSH_EVERY_N:-250}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ../..:/opt/traffic:ro
      - flink_data:/opt/flink/checkpoints
      - flink_tmp:/opt/flink/tmp
      - ${GCP_SERVICE_ACCOUNT_KEY:-/dev/null}:/secrets/gcp-key.json:ro
    networks:
      - capstone-net
    depends_on:
      - flink-jobmanager
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    restart: on-failure
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: node2-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - capstone-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    logging: *default-logging

  flink-python-job:
    build:
      context: ../..
      dockerfile: deployment/node2-streaming/Dockerfile.flink
    image: capstone/flink-streaming:1.19-node2
    container_name: node2-flink-python-job
    user: root
    entrypoint: []
    working_dir: /opt/traffic
    command: >
      bash -c "
        mkdir -p /opt/flink/checkpoints &&
        mkdir -p /opt/flink/tmp &&
        chown -R flink:flink /opt/flink/checkpoints &&
        chown -R flink:flink /opt/flink/tmp &&
        chmod -R 775 /opt/flink/checkpoints &&
        chmod -R 775 /opt/flink/tmp &&
        bash deployment/node2-streaming/flink_job_guard.sh
      "
    environment:
      PYTHONPATH: /opt/traffic
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
